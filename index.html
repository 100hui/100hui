<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baihui's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Space+Grotesk:wght@700&display=swap');

        :root {
            --cursor-x: 50%;
            --cursor-y: 50%;
            --radius: 140px;
            --primary: #ff9aab; /* Soft Pink from Jacket */
            --secondary: #0d9488; /* Teal from River */
            --bg-lit: #fafafa;
            --text-lit: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background-color 0.8s ease;
        }

        /* The darkness that covers the site */
        #flashlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100;
            pointer-events: none;
            mask-image: radial-gradient(
                circle var(--radius) at var(--cursor-x) var(--cursor-y),
                transparent 0%,
                black 100%
            );
            -webkit-mask-image: radial-gradient(
                circle var(--radius) at var(--cursor-x) var(--cursor-y),
                transparent 0%,
                black 100%
            );
            transition: opacity 1s ease;
        }

        /* Power Button: High Z-index to stay above the darkness */
        #power-system {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 150;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .awaken-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.9);
            color: white;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9999px; 
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .awaken-btn:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Normal State Trigger */
        body.system-online {
            background-color: #ffffff;
            color: #1e293b;
            overflow-y: auto;
        }

        body.system-online #flashlight-overlay {
            opacity: 0;
            pointer-events: none;
        }

        body.system-online #power-system {
            opacity: 0;
            pointer-events: none;
            bottom: -50px;
        }

        body.system-online #custom-cursor {
            display: none; /* Hide cursor in light mode */
        }

        /* Cute Blobs for Light Mode */
        .blob {
            position: absolute;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease 0.6s;
        }
        
        body.system-online .blob {
            opacity: 1;
        }
        
        .blob-1 {
            top: -5%;
            right: -15%;
            width: 350px;
            height: 350px;
            background: #ffedd5; /* Soft peach */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
        
        .blob-2 {
            bottom: -5%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: #f1f5f9; /* Soft slate */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }

        /* New Navigation Style */
        nav {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 3rem;
            padding: 1rem 3rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            z-index: 200;
            transition: all 0.5s ease;
        }

        body.system-online nav {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .nav-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            letter-spacing: -0.05em;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: inherit;
            opacity: 0.6;
            transition: opacity 0.3s, color 0.3s;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--primary);
        }

        #custom-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            background: white;
            mix-blend-mode: difference;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <!-- The Darkness Mask -->
    <div id="flashlight-overlay"></div>

    <!-- The Power Button -->
    <div id="power-system">
        <button class="awaken-btn" onclick="initiateSystem()">Click to turn on the light</button>
    </div>

    <!-- Redesigned Nav -->
    <nav>
        <div class="nav-brand">BAIHUI</div>
        <div class="nav-links">
            <a href="#" class="nav-link">Project</a>
            <a href="#" class="nav-link">Resume</a>
            <a href="#" class="nav-link">Contact</a>
        </div>
    </nav>

    <!-- Content -->
    <main class="relative z-10 min-h-screen flex flex-col justify-center px-8 md:px-20 pt-20 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            
            <!-- Text Column -->
            <div class="space-y-6 z-10">
                <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-[#111827]">
                    Hello,<br>
                    <span class="text-[#ff9aab]">I am Baihui</span>
                </h1>
                <h2 class="text-xl md:text-2xl font-semibold text-gray-700">Empathize. Create. Engage.</h2>
                <p class="max-w-lg text-lg text-gray-500 leading-relaxed font-medium">
                    Crafting human-centered digital journeys through intuitive design, visual storytelling, and interactive game development.
                </p>
            </div>

            <!-- Image Column -->
            <div class="flex justify-center relative z-10">
                <!-- Cute background blobs -->
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                
                <!-- Your Photo -->
                <img src="Images/1.jpeg" alt="Baihui" class="w-full max-w-[1080px] object-cover rounded-[40px] relative z-10 shadow-xl" style="aspect-ratio: 3/4;" />
            </div>

        </div>
    </main>

    <script>
        const overlay = document.getElementById('flashlight-overlay');
        const cursor = document.getElementById('custom-cursor');
        const root = document.documentElement;

        const mouse = { x: -100, y: -100 };

        // Mouse Tracker
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            root.style.setProperty('--cursor-x', `${mouse.x}px`);
            root.style.setProperty('--cursor-y', `${mouse.y}px`);

            cursor.style.left = `${mouse.x}px`;
            cursor.style.top = `${mouse.y}px`;
        });

        // Reveal Logic
        function initiateSystem() {
            document.body.classList.add('system-online');
            root.style.setProperty('--radius', '200vw');
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1000);
        }

        // Hover Effect for Cursor
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mouseenter', () => {
                if (document.body.classList.contains('system-online')) return;
                cursor.style.width = '80px';
                cursor.style.height = '80px';
                cursor.style.background = 'rgba(255,255,255,0.1)';
                cursor.style.border = '1px solid currentColor';
            });
            el.addEventListener('mouseleave', () => {
                if (document.body.classList.contains('system-online')) return;
                cursor.style.width = '24px';
                cursor.style.height = '24px';
                cursor.style.background = 'white';
                cursor.style.border = 'none';
            });
        });
    </script>
</body>
</html>
